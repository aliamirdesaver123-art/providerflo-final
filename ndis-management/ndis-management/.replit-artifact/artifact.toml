kind = "web"
  previewPath = "/app/"
  title = "ProviderFlo App"
  version = "1.0.0"
  id = "artifacts/ndis-management"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/app/" ]
  localPort = 21511

  [services.development]
  run = "pnpm --filter @workspace/ndis-management run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/ndis-management", "run", "build" ]
  publicDir = "artifacts/ndis-management/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "21511"
  BASE_PATH = "/app/"
  